
name: Publish Lopes Tracker iPhone App

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'assets/**'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Refresh Lopes Tracker']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lopes-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare website
        run: |
          mkdir -p _site/assets _site/icons _site/data
          cp index.html manifest.webmanifest service-worker.js _site/
          cp assets/app.js assets/styles.css _site/assets/
          cp icon-192.png icon-512.png apple-touch-icon.png _site/icons/
          cp data/results.json _site/data/
          cp players.json _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
