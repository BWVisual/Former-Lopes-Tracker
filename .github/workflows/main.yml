
name: Refresh Lopes Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lopes-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Organize project files
        run: |
          mkdir -p assets data
          if [ -f app.js ]; then mv app.js assets/app.js; fi
          if [ -f styles.css ]; then mv styles.css assets/styles.css; fi
          if [ -f results.json ]; then mv results.json data/results.json; fi
          if [ -f notified.json ]; then mv notified.json data/notified.json; fi

      - name: Check games and send notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONTEHALL_API_KEY: ${{ secrets.MONTEHALL_API_KEY }}
          NCAA_API_BASE: ${{ vars.NCAA_API_BASE }}
        run: python tracker.py --days 3

      - name: Save updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update Lopes Tracker data"
            git push
          fi
